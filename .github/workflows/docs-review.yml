name: Docs Review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (leave empty to exit cleanly)'
        required: false
        default: ''

concurrency:
  group: docs-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-review:
    if: github.event.label.name == 'docs-review' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: python -m pip install -r .github/scripts/requirements.txt --quiet

      # ── 3. Vale ──────────────────────────────────────────────────────
      - name: Install Vale
        run: |
          VALE_VERSION="3.14.2"
          curl -sL --max-time 120 \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Windows_64-bit.zip" \
            -o "$RUNNER_TEMP/vale.zip"
          unzip -o "$RUNNER_TEMP/vale.zip" -d "$RUNNER_TEMP/vale-bin"
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vale-bin/vale" --version

      # ── 3a. Vale config diagnostics ──────────────────────────────────
      - name: Vale config diagnostics
        run: |
          echo "=== .vale-ru.ini ===" && \
            "$RUNNER_TEMP/vale-bin/vale" --config="$(pwd)/.vale-ru.ini" ls-config 2>&1 | head -40 || true
          echo "=== .vale-en.ini ===" && \
            "$RUNNER_TEMP/vale-bin/vale" --config="$(pwd)/.vale-en.ini" ls-config 2>&1 | head -40 || true

      # ── 4. Get changed docs files ─────────────────────────────────────
      - name: Get changed docs files
        id: changed-files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:    ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO:         ${{ github.repository }}
        run: |
          python .github/scripts/get_changed_files.py \
            > "$RUNNER_TEMP/changed_files.txt" || true
          CHANGED=$(cat "$RUNNER_TEMP/changed_files.txt" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "No eligible docs files changed."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files:"
            cat "$RUNNER_TEMP/changed_files.txt"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Fetch rules and style guide (MCP -> local fallback) ────────
      - name: Fetch rules and style guide
        if: steps.changed-files.outputs.has_files == 'true'
        id: fetch-rules
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          MCP_API_KEY:    ${{ secrets.MCP_API_KEY }}
        run: python .github/scripts/fetch_rules.py

      # ── 5a. Lint Russian files ────────────────────────────────────────
      - name: Lint Russian files (Python)
        if: steps.changed-files.outputs.has_files == 'true'
        id: lint-ru
        run: |
          RU_FILES=$(grep 'docs/ru' "$RUNNER_TEMP/changed_files.txt" 2>/dev/null | tr '\n' ' ' || true)
          if [ -n "$RU_FILES" ]; then
            echo "[INFO] Checking Russian files: $RU_FILES"
            python .github/scripts/ru_linter.py \
              --files $RU_FILES \
              --output "$RUNNER_TEMP/vale_ru.json" \
              --styles-dir "${{ steps.fetch-rules.outputs.ru_rules_dir }}"
          else
            echo "[INFO] No Russian files -- skipping."
            echo "{}" > "$RUNNER_TEMP/vale_ru.json"
          fi

      # ── 5b. Lint English files (Vale) ─────────────────────────────────
      - name: Lint English files (Vale)
        if: steps.changed-files.outputs.has_files == 'true'
        id: lint-en
        run: |
          EN_FILES=$(grep 'docs/en' "$RUNNER_TEMP/changed_files.txt" 2>/dev/null | tr '\n' ' ' || true)
          if [ -n "$EN_FILES" ]; then
            echo "[INFO] Checking English files: $EN_FILES"
            "$RUNNER_TEMP/vale-bin/vale" --config="$(pwd)/.vale-en.ini" --output=JSON $EN_FILES \
              > "$RUNNER_TEMP/vale_en.json" \
              2> "$RUNNER_TEMP/vale_en.err" \
              || true
            if [ -s "$RUNNER_TEMP/vale_en.err" ]; then
              echo "[WARN] Vale stderr:"
              cat "$RUNNER_TEMP/vale_en.err"
            fi
          else
            echo "[INFO] No English files -- skipping."
            echo "{}" > "$RUNNER_TEMP/vale_en.json"
          fi

      # ── 5c. Check broken links (Lychee) ──────────────────────────────
      - name: Install Lychee
        run: |
          LYCHEE_VERSION="0.24.2"
          curl -sL --max-time 120 \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-pc-windows-msvc.zip" \
            -o "$RUNNER_TEMP/lychee.zip"
          unzip -o "$RUNNER_TEMP/lychee.zip" -d "$RUNNER_TEMP/lychee-bin"
          # zip extracts into a versioned subdirectory; find the exe regardless of name
          LYCHEE_DIR=$(ls -d "$RUNNER_TEMP/lychee-bin"/lychee-*/  2>/dev/null | head -1)
          echo "$LYCHEE_DIR" >> "$GITHUB_PATH"
          "$LYCHEE_DIR/lychee.exe" --version

      - name: Check broken links (Lychee)
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          REPO_ROOT="$(pwd)"
          # Build absolute paths; strip \r from Windows CRLF line endings
          FILES=$(sed 's/\r//' "$RUNNER_TEMP/changed_files.txt" | \
            while IFS= read -r f; do [ -n "$f" ] && echo "$REPO_ROOT/$f"; done | \
            tr '\n' ' ')
          if [ -n "$FILES" ]; then
            lychee \
              --format json \
              --output "$RUNNER_TEMP/lychee_raw.json" \
              --timeout 10 \
              --max-retries 1 \
              --no-progress \
              $FILES || true
            python .github/scripts/convert_lychee.py \
              "$RUNNER_TEMP/lychee_raw.json" \
              "$RUNNER_TEMP/lychee.json"
          else
            echo "{}" > "$RUNNER_TEMP/lychee.json"
          fi

      # ── 5d. Check typos (Codespell, EN only) ─────────────────────────
      - name: Check typos (Codespell)
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          EN_FILES=$(grep 'docs/en' "$RUNNER_TEMP/changed_files.txt" 2>/dev/null | tr '\n' ' ' || true)
          if [ -n "$EN_FILES" ]; then
            python .github/scripts/run_codespell.py \
              --files $EN_FILES \
              --output "$RUNNER_TEMP/codespell.json"
          else
            echo "[INFO] No EN files -- skipping Codespell."
            echo "{}" > "$RUNNER_TEMP/codespell.json"
          fi

      # ── 5e. Merge lint results ─────────────────────────────────────────
      - name: Merge lint results
        if: steps.changed-files.outputs.has_files == 'true'
        id: vale
        run: |
          python .github/scripts/merge_lint.py \
            "$RUNNER_TEMP/vale_ru.json" \
            "$RUNNER_TEMP/vale_en.json" \
            "$RUNNER_TEMP/lychee.json" \
            "$RUNNER_TEMP/codespell.json" \
            > "$RUNNER_TEMP/vale_output.json"

          WARN_COUNT=$(python -c "import json; d=json.load(open('$RUNNER_TEMP/vale_output.json')); print(sum(len(v) for v in d.values() if isinstance(v,list)))" 2>/dev/null || echo 0)
          echo "Total warnings: $WARN_COUNT"

      # ── 6. LLM review agent ───────────────────────────────────────────
      - name: Run LLM review agent
        if: steps.changed-files.outputs.has_files == 'true'
        env:
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:    ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO:         ${{ github.repository }}
          BASE_REF:     ${{ github.base_ref || 'main' }}
        run: |
          python .github/scripts/review-agent.py \
            --changed-files "$RUNNER_TEMP/changed_files.txt" \
            --vale-output "$RUNNER_TEMP/vale_output.json" \
            --style-guide-dir "${{ steps.fetch-rules.outputs.styleguide_dir }}"
